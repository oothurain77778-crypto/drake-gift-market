<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Drake Gift Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0e0e0e;--card:#1a1a1a;--card2:#222;--text:#fff;--muted:#888;--accent:#ffd700;--green:#4caf50;--blue:#2196f3}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding-bottom:80px}
.header{position:sticky;top:0;z-index:10;background:rgba(14,14,14,.95);backdrop-filter:blur(10px);padding:12px 16px;border-bottom:1px solid #222}
.header h1{font-size:20px;font-weight:700}
.header h1 span{color:var(--accent)}
.search-bar{padding:12px 16px}
.search-bar input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid #333;background:var(--card);color:var(--text);font-size:15px;outline:none}
.search-bar input:focus{border-color:var(--accent)}
.collections{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.collections button{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid #333;background:var(--card);color:var(--text);font-size:14px;cursor:pointer}
.collections button.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.filters{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.filters select{padding:8px 12px;border-radius:10px;border:1px solid #333;background:var(--card);color:var(--text);font-size:13px}
.wallet-bar{padding:0 16px 12px;display:flex;justify-content:space-between;align-items:center}
#ton-connect-button button{padding:8px 16px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid #222}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.card-body{padding:10px 12px}
.card-name{font-size:14px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-num{font-size:12px;color:var(--muted);margin-bottom:8px}
.card-traits{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.4}
.card-footer{display:flex;justify-content:space-between;align-items:center}
.price{font-size:15px;font-weight:700;color:var(--accent)}
.buy-btn{padding:6px 14px;border-radius:8px;border:none;background:var(--green);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.buy-btn:disabled{background:#444;color:#888;cursor:default}
.loading{text-align:center;padding:40px;color:var(--muted)}
.error{text-align:center;padding:40px;color:#f44336}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(14,14,14,.98);border-top:1px solid #222;display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.bottom-nav div{flex:1;text-align:center;font-size:11px;color:var(--muted);padding:4px}
.bottom-nav div.active{color:var(--accent)}
</style>
</head>
<body>
<div class="header"><h1>🎁 <span>Drake</span> Gift Market</h1></div>
<div class="wallet-bar"><span id="wallet-status" style="font-size:13px;color:var(--muted)">Wallet not connected</span><div id="ton-connect-button"></div></div>
<div class="search-bar"><input type="text" id="search" placeholder="Search by gift name or number..."></div>
<div class="collections" id="collections"></div>
<div class="filters">
<select id="filter-model"><option value="">All Models</option></select>
<select id="filter-backdrop"><option value="">All Backdrops</option></select>
<select id="filter-symbol"><option value="">All Symbols</option></select>
</div>
<div class="grid" id="grid"><div class="loading">Loading gifts...</div></div>
<div class="bottom-nav"><div class="active">🏪 Market</div><div>📦 Orders</div><div>🎮 Play</div><div>📋 Tasks</div></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();document.body.style.background=tg.backgroundColor||'#0e0e0e'}
const COLLECTIONS=[
{name:'Instant Ramen',slug:'instantramen',addr:'0:488f4b85faa2004aabfaa88bdc4e27f6c0a49db7859073899ca01cb0369e469e'},
{name:'Candy Cane',slug:'candycane',addr:'0:cb33ae6dd2c852ee064083494c96d187621b14f783f3b0c24785889b99157b91'},
{name:'Lol Pop',slug:'lolpop',addr:'0:bace389df2f24d116a9c5e4d745e3b1d0cb44a6dc3d9cdb1eeb2e116e85a2439'},
{name:'Plush Pepe',slug:'plushpepe',addr:'0:46fa0e9a864014196a5e7d66f1f83ffdb10f2859bbf2ea9baeabbf14d9ce0d50'}];
let cur=0,items=[],lastFetch=0;
const tonConnectUI=new TON_CONNECT_UI.TonConnectUI({manifestUrl:location.origin+location.pathname.replace(/[^/]*$/,'')+'tonconnect-manifest.json',buttonRootId:'ton-connect-button'});
tonConnectUI.onStatusChange(w=>{document.getElementById('wallet-status').textContent=w?w.account.address.slice(0,6)+'...'+w.account.address.slice(-4):'Wallet not connected';render()});
function thumb(slug,num){return `https://nft.fragment.com/gift/${slug}-${num}.webp`}
async function fetchItems(){
const now=Date.now();if(now-lastFetch<1100)await new Promise(r=>setTimeout(r,1100-(now-lastFetch)));lastFetch=Date.now();
const c=COLLECTIONS[cur];
try{const r=await fetch(`https://tonapi.io/v2/nfts/collections/${c.addr}/items?limit=50&offset=0`);const d=await r.json();items=d.nft_items||[];buildFilters();render()}
catch(e){document.getElementById('grid').innerHTML='<div class="error">Failed to load. Check connection.</div>'}}
function buildFilters(){
const m=new Set(),b=new Set(),s=new Set();
items.forEach(it=>(it.metadata?.attributes||[]).forEach(a=>{if(a.trait_type==='Model')m.add(a.value);if(a.trait_type==='Backdrop')b.add(a.value);if(a.trait_type==='Symbol')s.add(a.value)}));
const fill=(id,set)=>{const el=document.getElementById(id);const cur2=el.value;el.innerHTML='<option value="">All</option>'+[...set].sort().map(v=>`<option>${v}</option>`).join('');el.value=cur2};
fill('filter-model',m);fill('filter-backdrop',b);fill('filter-symbol',s)}
function render(){
const q=document.getElementById('search').value.toLowerCase(),fm=document.getElementById('filter-model').value,fb=document.getElementById('filter-backdrop').value,fs=document.getElementById('filter-symbol').value;
const c=COLLECTIONS[cur];
let list=items.filter(it=>{
const name=(it.metadata?.name||'').toLowerCase();if(q&&!name.includes(q))return false;
const at=it.metadata?.attributes||[];const has=(t,v)=>!v||at.some(a=>a.trait_type===t&&a.value===v);
return has('Model',fm)&&has('Backdrop',fb)&&has('Symbol',fs)});
const g=document.getElementById('grid');
if(!list.length){g.innerHTML='<div class="loading">No gifts found</div>';return}
const connected=tonConnectUI.wallet!=null;
g.innerHTML=list.map(it=>{
const num=(it.metadata?.name||'').split('#')[1]||'';const price=it.sale? (parseInt(it.sale.price.value)/1e9).toFixed(2):null;
const traits=(it.metadata?.attributes||[]).map(a=>a.value).join(' · ');
return `<div class="card"><img src="${thumb(c.slug,num)}" loading="lazy" onerror="this.style.display='none'"><div class="card-body"><div class="card-name">${it.metadata?.name||'Unknown'}</div><div class="card-num">#${num}</div><div class="card-traits">${traits}</div><div class="card-footer">${price?`<span class="price">💎 ${price}</span><button class="buy-btn" ${connected?'':'disabled'} onclick="buy('${it.sale.address}','${it.sale.price.value}')">Buy</button>`:'<span style="color:var(--muted);font-size:12px">Not for sale</span>'}</div></div></div>`}).join('')}
async function buy(saleAddr,priceNano){
try{await tonConnectUI.sendTransaction({validUntil:Math.floor(Date.now()/1000)+300,messages:[{address:saleAddr,amount:String(priceNano)}]});if(tg)tg.showAlert('Transaction sent!')}catch(e){if(tg)tg.showAlert('Cancelled')}}
document.getElementById('collections').innerHTML=COLLECTIONS.map((c,i)=>`<button class="${i===0?'active':''}" onclick="selCol(${i})">${c.name}</button>`).join('');
function selCol(i){cur=i;document.querySelectorAll('#collections button').forEach((b,j)=>b.classList.toggle('active',j===i));document.getElementById('grid').innerHTML='<div class="loading">Loading...</div>';fetchItems()}
document.getElementById('search').addEventListener('input',()=>render());
['filter-model','filter-backdrop','filter-symbol'].forEach(id=>document.getElementById(id).addEventListener('change',()=>render()));
fetchItems();
</script>
</body>
</html>
